name: Python CI

on:
  push:
    branches: [dev, main]
    paths:                                   
      - mobile_systeme_und_cloud/script_beispiele/dev_ops/**
      - .github/workflows/python-ci.yml

permissions:
  contents: read

defaults:
  run:
    working-directory: mobile_systeme_und_cloud/script_beispiele/dev_ops

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest

  build-dev:
    needs: [lint, test]                      # nur, wenn Linter und Tests grün sind
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t hello-api:dev .

  build-main:
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                        # Image in die Registry hochladen
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hello-api"   # ,, = Kleinbuchstaben, Pflicht für Image-Namen
          docker build -t "$IMAGE:latest" .
          docker push "$IMAGE:latest"
